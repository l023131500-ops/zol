<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KioskFleet — מערכת ניהול</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- Document-relative, not root-relative: this page is served both at the
       root (Railway URL, local dev) and under more30.com/kiosk/. A leading
       slash would send the browser to more30.com/css/style.css. -->
  <link rel="stylesheet" href="css/style.css" />
  <!-- The platform-wide login pill. One file, loaded by every more30 system. -->
  <script src="https://more30.com/auth-button.js" defer></script>
</head>
<body>
  <!-- Login -->
  <div id="login-view" class="auth-wrap">
    <form class="auth-card" id="login-form">
      <div class="brand"><span class="logo">◈</span> KioskFleet</div>
      <h2>כניסה למערכת</h2>
      <p class="hint">הזינו את שם המשתמש והסיסמה שקיבלתם</p>
      <div id="login-error" class="alert alert-error hidden"></div>
      <div class="field"><label>שם משתמש</label><input id="login-user" autocomplete="username" required /></div>
      <div class="field"><label>סיסמה</label><input id="login-pass" type="password" autocomplete="current-password" required /></div>
      <button class="btn btn-primary" style="width:100%" type="submit">כניסה</button>
      <p class="hint" style="margin-top:18px"><a href="./">← חזרה לאתר</a></p>
    </form>
  </div>

  <!-- App shell -->
  <div id="app-view" class="app hidden">
    <aside class="side">
      <div class="brand"><span class="logo">◈</span> KioskFleet</div>
      <nav id="menu">
        <a data-view="devices" class="active">🖥️ המכשירים שלי</a>
        <a data-view="links">🔗 ספריית קישורים</a>
        <a data-view="enroll">➕ הוספת מכשיר</a>
        <a data-view="guide">📖 הוראות הפעלה</a>
        <a data-view="admin" id="menu-admin" class="hidden">👑 ניהול-על</a>
        <a data-view="settings">⚙️ הגדרות</a>
      </nav>
      <div class="userbox">
        <div id="user-name">—</div>
        <div id="user-quota" style="color:#8fa2c0;margin:6px 0 12px"></div>
        <a id="logout-btn" class="btn btn-ghost btn-sm">התנתקות</a>
      </div>
    </aside>

    <main class="main">
      <div id="content"></div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="js/app.js"></script>
</body>
</html>
